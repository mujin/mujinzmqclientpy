# This workflow will install Python dependencies and run lint / type checks with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_python3:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13.5]

    # Run inside the official Python image, since setup-python only ships prebuilt
    # interpreters for specific runner OS versions and may not cover the pinned version.
    container:
      image: python:${{ matrix.python-version }}

    # The ruff / mypy configuration lives alongside the package sources.
    defaults:
      run:
        working-directory: python

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        # mypy follows imports into the package, so its runtime dependencies must be importable.
        # mujinwebstackclient is not published on PyPI, so install it from source.
        pip install pyzmq "git+https://github.com/mujin/mujinwebstackclientpy.git"

    - name: Lint with ruff
      run: |
        ruff check --output-format=github
        ruff format --check --diff

    - name: Type check with mypy
      run: |
        mypy
